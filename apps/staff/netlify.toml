# Staff app (judges, coaches, admins). Netlify site setting: base directory = apps/staff.
[build]
  command = "cd ../.. && npm ci && npm run build:staff"
  publish = "../../dist/staff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
